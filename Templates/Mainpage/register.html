{% extends "Mainpage/base.html" %}
{% block content %}
<div class="wrap">
  <div class="form-card">
    <span class="waypoint">NEW ACCOUNT</span>
    <h1 style="margin-top:12px;">Create your account</h1>
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label>Email</label>
        {{ form.email }}
        {% for error in form.email.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
      </div>
      <div class="field">
        <label>Phone number</label>
        {{ form.phone }}
      </div>
      <button type="submit" class="btn" style="width:100%;">Register</button>
    </form>
    <p class="form-foot">Already have an account? <a href="/accounts/login/">Log in</a></p>
  </div>
</div>
{% endblock %}
