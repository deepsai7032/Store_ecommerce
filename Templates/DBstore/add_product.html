{% extends "Mainpage/base.html" %}
{% block content %}
<div class="wrap">
  <div class="form-card">
    <span class="waypoint">NEW PRODUCT</span>
    <h1 style="margin-top:12px;">Add a product</h1>
    <form method="post" enctype="multipart/form-data" >
      {% csrf_token %}
      {% for field in form %}
        <div class="field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
        </div>
      {% endfor %}
      <div class="form-actions">
    <button type="submit" name="action" value="add_another" class="btn btn-secondary">
      Save & add another
    </button>
    <button type="submit" name="action" value="view_products" class="btn">
      Save & view products
    </button>
  </div>
    </form>
  </div>
</div>
{% endblock %}
